###############################
  - id: bar1_left_draw
    then:
  - id: bar1_right_draw
    then:
  - id: bar2_left_draw
    then:
  - id: bar2_right_draw
    then:
  - id: bar3_left_draw
    then:
  - id: bar3_right_draw
    then:
######################
### update scripts ###
######################
  - id: update_main
    then:
      - component.update: main_display
  - id: update_all
    then:
      - component.update: main_display
      - delay: 5ms
      - script.execute: update_bar1_left
      - delay: 5ms
      - script.execute: update_bar1_right
      - delay: 5ms
      - script.execute: update_bar2_left
      - delay: 5ms
      - script.execute: update_bar2_right
      - delay: 5ms
      - script.execute: update_bar3_left
      - delay: 5ms
      - script.execute: update_bar3_right
